services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file:
      - ./.env
    entrypoint:
      - /bin/sh
      - -c
      - |
        export POSTGRES_DB="$$DB_NAME"
        export POSTGRES_USER="$$DB_USER"
        export POSTGRES_PASSWORD="$$DB_PASSWORD"
        exec docker-entrypoint.sh postgres
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$DB_USER -d $$DB_NAME"]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build: .
    env_file:
      - ./.env
      - ./.smtp_mailjet.env
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    environment:
      DEBUG: "1"
      ALLOWED_HOSTS: "localhost,127.0.0.1"
      SECRET_KEY: "dev-only-secret-key-change-me"
      DB_HOST: "db"
      DB_PORT: "5432"
      DATA_ENCRYPTION_KEY: "${DATA_ENCRYPTION_KEY:-}"
      INVITE_ONLY_SIGNUP: "${INVITE_ONLY_SIGNUP:-1}"
      INVITE_EXPIRY_HOURS: "${INVITE_EXPIRY_HOURS:-168}"
      SITE_BASE_URL: "${SITE_BASE_URL:-http://localhost:8000}"
      MAILJET_API_KEY: "${MAILJET_API_KEY:-}"
      MAILJET_API_SECRET: "${MAILJET_API_SECRET:-}"
      MAILJET_SENDER_EMAIL: "${MAILJET_SENDER_EMAIL:-no-reply-lang@enricosaccon.me}"
      MAILJET_SENDER_NAME: "${MAILJET_SENDER_NAME:-Lumina Lexicon}"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npm install && npm run build-css && python manage.py migrate && python manage.py runserver 0.0.0.0:8000"

volumes:
  node_modules:
  postgres_data:

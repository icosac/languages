<header class="sticky top-0 z-30 bg-surface">
  <div class="mx-auto flex h-16 max-w-7xl items-center justify-between px-6 md:px-10">
    <a href="/" class="font-display text-2xl font-extrabold tracking-tight text-on-surface">Lumina Lexicon</a>
    <nav class="hidden items-center gap-10 md:flex">
      {% for item in nav_items %}
        <a href="{{ item.url }}" class="pb-1 font-body text-sm {% if request.path == item.url %}border-b-2 border-primary font-semibold text-primary{% else %}text-outline-variant hover:text-primary{% endif %}">
          {{ item.label }}
        </a>
      {% endfor %}
    </nav>
    <div class="hidden items-center gap-5 md:flex">
      <span class="material-symbols-outlined text-on-surface-variant">language</span>
      <div class="relative">
        <button id="profile-menu-button" type="button" class="flex items-center gap-1 rounded-panel px-2 py-1 text-on-surface-variant hover:bg-surface-container-low hover:text-primary" aria-haspopup="true" aria-expanded="false" aria-controls="profile-menu">
          <span class="material-symbols-outlined">account_circle</span>
        </button>
        <div id="profile-menu" class="absolute right-0 top-12 hidden min-w-[170px] rounded-xl bg-surface-container-lowest p-2 editorial-shadow">
          {% if request.user.is_authenticated %}
            <a href="/profile/" class="block rounded-lg px-3 py-2 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">Profile</a>
            <a href="/profile/#settings" class="block rounded-lg px-3 py-2 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">Settings</a>
            <a href="/logout/" class="block rounded-lg px-3 py-2 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">Logout</a>
          {% else %}
            <a href="/login/" class="block rounded-lg px-3 py-2 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">Login</a>
            <a href="/register/" class="block rounded-lg px-3 py-2 text-sm text-on-surface-variant hover:bg-surface-container-low hover:text-on-surface">Create account</a>
          {% endif %}
        </div>
      </div>
    </div>
    <button id="menu-toggle" class="md:hidden lumina-btn-secondary" type="button" aria-label="Toggle navigation">Menu</button>
  </div>
  <div id="mobile-nav" class="hidden px-6 pb-5 md:hidden">
    <div class="rounded-panel bg-surface-container-low p-3">
      {% for item in nav_items %}
        <a href="{{ item.url }}" class="block rounded-panel px-4 py-3 font-label text-xs font-semibold uppercase tracking-wide {% if request.path == item.url %}bg-surface-container-lowest text-primary{% else %}text-on-surface-variant{% endif %}">
          {{ item.label }}
        </a>
      {% endfor %}
    </div>
  </div>
</header>

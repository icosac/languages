{% if href %}
  <a href="{{ href }}" class="{% if variant == 'secondary' %}lumina-btn-secondary{% else %}lumina-btn-primary{% endif %}">
    {{ text }}
  </a>
{% else %}
  <button type="{{ type|default:'button' }}" class="{% if variant == 'secondary' %}lumina-btn-secondary{% else %}lumina-btn-primary{% endif %}">
    {{ text }}
  </button>
{% endif %}

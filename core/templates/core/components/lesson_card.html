<article class="lumina-card flex items-start justify-between gap-5">
  <div class="space-y-1">
    <p class="font-display text-lg font-bold text-on-surface">{{ lesson.title }}</p>
    <p class="max-w-xl text-sm leading-relaxed text-on-surface-variant">{{ lesson.description }}</p>
    <p class="font-label text-[11px] font-semibold uppercase tracking-wider text-on-surface-variant">{{ lesson.minutes }} min</p>
  </div>
  <div class="rounded-panel px-3 py-2 text-[11px] font-label font-semibold uppercase tracking-wider {% if lesson.status == 'completed' %}bg-primary-container text-on-primary-container{% elif lesson.status == 'in_progress' %}bg-surface-container-high text-primary{% elif lesson.status == 'next' %}bg-muted text-on-surface{% else %}bg-surface-container-high text-on-surface-variant{% endif %}">
    {{ lesson.status|cut:'_' }}
  </div>
</article>
